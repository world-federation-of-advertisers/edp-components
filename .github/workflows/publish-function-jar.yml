# Publishes the Meta impression-query Cloud Function deploy JAR to this repository's GitHub
# Packages, so cross-media-measurement's Terraform can download it the same way it downloads its own
# Cloud Function JARs.
name: Publish function JAR
run-name: Publish function JAR | package-version=${{ inputs.package-version || github.sha }}

on:
  workflow_dispatch:
    inputs:
      package-version:
        description: "Maven version: a release such as 0.1.0 (run from tag v0.1.0), or empty for 0.0.0-<commit>"
        type: string
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish function JAR
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      BAZEL_TARGET_LABEL: //src/main/kotlin/org/wfanet/measurement/edpcomponents/meta:MetaImpressionQueryFunction_deploy.jar
      ARTIFACT_GROUP_ID: org.wfanet.measurement.edpcomponents.meta
      ARTIFACT_ID: meta-impression-query
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Bazel resolves common-testing from GitHub Packages, which needs credentials even to read.
      - name: Configure Maven credentials
        env:
          PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_USER: ${{ github.actor }}
        run: |
          printf 'machine maven.pkg.github.com\nlogin %s\npassword %s\n' \
            "$PACKAGES_USER" "$PACKAGES_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Set up Bazel
        uses: world-federation-of-advertisers/actions/setup-bazel@390a9ea948eef416333f8c257ef6116552a42d23 # v2.6.0

      - name: Set up Java and Maven
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: "17"

      # With no version given, the version is derived from the source commit, for testing before a
      # release. A release such as 0.1.0 must be published from its tag v0.1.0, so the version always
      # names the code in the JAR and cross-media-measurement tests the code it deployed. Neither is
      # a SNAPSHOT, so GitHub Packages refuses to republish them. Any other value becomes a SNAPSHOT
      # so it cannot be mistaken for either.
      - name: Resolve artifact version
        id: version
        env:
          PACKAGE_VERSION: ${{ inputs.package-version }}
        run: |
          if [[ -z "$PACKAGE_VERSION" ]]; then
            artifact_version="0.0.0-${GITHUB_SHA:0:12}"
          elif [[ "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+)?$ ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v$PACKAGE_VERSION" ]]; then
              echo "Release $PACKAGE_VERSION must be published from tag v$PACKAGE_VERSION, not $GITHUB_REF" >&2
              exit 1
            fi
            artifact_version="$PACKAGE_VERSION"
          else
            artifact_version="0.0.0-${PACKAGE_VERSION}-SNAPSHOT"
          fi
          echo "artifact-version=$artifact_version" >> "$GITHUB_OUTPUT"

      - name: Build deploy JAR
        run: bazel build "$BAZEL_TARGET_LABEL"

      - name: Publish to GitHub Packages
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_VERSION: ${{ steps.version.outputs.artifact-version }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<SETTINGS
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${MAVEN_USERNAME}</username>
                <password>${MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
          jar_path="$(bazel cquery "$BAZEL_TARGET_LABEL" --output=files)"
          mvn -B -e deploy:deploy-file \
            -Durl="https://maven.pkg.github.com/${{ github.repository }}" \
            -DrepositoryId=github \
            -Dfile="$jar_path" \
            -DgroupId="$ARTIFACT_GROUP_ID" \
            -DartifactId="$ARTIFACT_ID" \
            -Dversion="$ARTIFACT_VERSION" \
            -DgeneratePom=true \
            -Dpackaging=jar
