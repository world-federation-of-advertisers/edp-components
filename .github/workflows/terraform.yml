name: Terraform

on:
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches:
      - main
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/main/terraform/gcloud/meta-impression-query
    steps:
      - name: Check out revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      # -backend=false so no credentials or remote state are needed; -lockfile=readonly fails if
      # the committed lock file does not cover the configured providers.
      - name: Initialize
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate
